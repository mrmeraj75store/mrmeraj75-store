<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MrMeraj75 Store</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f5f5;}

header{
background:#131921;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
}

.search{
width:50%;
padding:10px;
border-radius:5px;
border:none;
}

.banner{
background:#ff9900;
padding:50px;
text-align:center;
color:white;
font-size:30px;
font-weight:bold;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.price{
font-size:24px;
color:red;
font-weight:bold;
}

.old{
text-decoration:line-through;
color:gray;
}

button{
margin-top:10px;
padding:10px 20px;
background:#ff9900;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

footer{
background:#131921;
color:white;
padding:20px;
text-align:center;
margin-top:30px;
}
</style>

</head>

<body>

<header>
<div class="logo">🛍 MrMeraj75 Store</div>
<input class="search" placeholder="Search products...">
</header>

<div class="banner">
Big Sale 🔥 Up To 50% OFF
</div>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/300x350.png?text=Kurti" alt="">
<h2>Pink Sleeveless Kurti</h2>
<p class="old">₹399</p>
<p class="price">₹199</p>
<button>Add to Cart</button>
</div>

</section>

<footer>
© 2026 MrMeraj75 Store | All Rights Reserved
</footer>

</body>
</html>
